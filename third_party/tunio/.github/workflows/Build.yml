name: Build

on:
  push:
  workflow_dispatch:

jobs:
  Linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Update OS and Compilers
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build pkg-config

      - name: Install Boost headers
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" \
            https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          echo "BOOST_ROOT=$RUNNER_TEMP/boost_1_92_0" >> "$GITHUB_ENV"

      - name: Build tunio (Release)
        run: |
          # 非 tests 保持 Release 构建（库 + 示例）
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTUNIO_BUILD_TESTS=OFF -G Ninja
          cmake --build build

      - name: Build and run tests (Debug)
        run: |
          # 测试在 Debug 构建下运行：Release 的 NDEBUG 会编译掉测试断言
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Debug -DTUNIO_BUILD_EXAMPLES=OFF -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

      - name: Install smoke test (find_package + pkg-config)
        run: |
          # 安装导出包必须能脱离源码树被消费方使用：公开头内联包含的
          # detail/ 实现头（引擎头等）需随包导出（见根 CMakeLists.txt 的
          # 安装规则）。此步骤安装到临时前缀，并用 find_package 与
          # pkg-config 两条路径各编译一次消费方.
          prefix="$RUNNER_TEMP/tunio-prefix"
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DTUNIO_INSTALL=ON \
            -DTUNIO_BUILD_TESTS=OFF -DTUNIO_BUILD_EXAMPLES=OFF
          cmake --build build-install
          cmake --install build-install --prefix "$prefix"

          # find_package(tunio)：独立消费方工程经导入目标编译并链接
          cmake -S tests/install -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-consumer
          ./build-consumer/tunio_install_consumer

          # pkg-config：等价的编译与链接参数（Boost 头文件不在默认搜索
          # 路径时由 BOOST_ROOT 补充，与 find_package 路径一致）
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          boost_include=""
          if [ -n "$BOOST_ROOT" ]; then boost_include="-I$BOOST_ROOT"; fi
          c++ -std=c++20 $boost_include tests/install/consumer.cpp \
            $(pkg-config --cflags tunio) $(pkg-config --libs tunio) \
            -o "$RUNNER_TEMP/tunio-pc-consumer"
          "$RUNNER_TEMP/tunio-pc-consumer"

      - name: Check UTF-8 BOM on code files
        run: |
          # 项目编码风格为 UTF-8 (with BOM)
          err=0
          while IFS= read -r f; do
            if ! head -c3 "$f" | od -An -tx1 | tr -d ' \n' | grep -q 'efbbbf'; then
              echo "missing BOM: $f"
              err=1
            fi
          done < <(find include src tests examples \( -name '*.hpp' -o -name '*.cpp' \) | sort)
          exit $err

  MacOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Install Boost headers
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" \
            https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          echo "BOOST_ROOT=$RUNNER_TEMP/boost_1_92_0" >> "$GITHUB_ENV"

      - name: "Build tunio (Release, Universal Binary: x86_64 + arm64)"
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTUNIO_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -G Ninja
          cmake --build build

      - name: "Build and run tests (Debug, Universal Binary)"
        run: |
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTUNIO_BUILD_EXAMPLES=OFF \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  Windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖两种 Windows 设备实现: 默认 overlapped I/O 与 Wintun.
        device: [overlapped, wintun]
    steps:
      - uses: actions/checkout@v6

      - name: Install Boost headers
        shell: bash
        run: |
          # Windows 下 RUNNER_TEMP 为 D:\... 反斜杠路径, tar 会把盘符
          # 误解析为远程主机, 先经 cygpath 转为 POSIX 路径再解压;
          # BOOST_ROOT 写给原生 cmake, 使用混合分隔符路径.
          RT="$(cygpath -u "$RUNNER_TEMP")"
          RTW="$(cygpath -m "$RUNNER_TEMP")"
          curl -fL --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" \
            https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
          tar -xzf "$RT/boost.tar.gz" -C "$RT"
          echo "BOOST_ROOT=$RTW/boost_1_92_0" >> "$GITHUB_ENV"

      # tests/examples 目前依赖 POSIX 头文件, Windows 下仅构建库.
      - name: Build tunio
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_WINTUN_DRIVER=${{ matrix.device == 'wintun' && 'ON' || 'OFF' }} -DTUNIO_BUILD_TESTS=OFF -DTUNIO_BUILD_EXAMPLES=OFF
          cmake --build build --config Release --parallel

  Mingw:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 覆盖两种 Windows 设备实现: 默认 overlapped I/O 与 Wintun.
        device: [overlapped, wintun]
    steps:
      - uses: actions/checkout@v6

      - name: Update OS and Compilers
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build mingw-w64

      # 交叉编译工具链以 /usr/x86_64-w64-mingw32 为 sysroot, 需把
      # Boost 头文件复制进 sysroot, 否则 find_package(Boost) 找不到.
      - name: Install Boost headers into MinGW sysroot
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/boost.tar.gz" \
            https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          sudo cp -r "$RUNNER_TEMP/boost_1_92_0/boost" /usr/x86_64-w64-mingw32/include/

      - name: Build tunio
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DUSE_WINTUN_DRIVER=${{ matrix.device == 'wintun' && 'ON' || 'OFF' }} -DTUNIO_BUILD_TESTS=OFF -DTUNIO_BUILD_EXAMPLES=OFF
          cmake --build build --config Release
