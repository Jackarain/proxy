name: Find Component CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/**
    tags: ['**']
  workflow_dispatch:

jobs:
  a-m:
    strategy:
      fail-fast: false
      matrix:
        library:
          - accumulators
          - algorithm
          - align
          - any
          - array
          - asio
          - assert
          - assign
          - atomic
          - beast
          - bimap
          - bind
          - bloom
          - callable_traits
          - charconv
          - chrono
          - circular_buffer
          # - cobalt
          - compat
          - compute
          - concept_check
          - config
          - container
          - container_hash
          - context
          - contract
          - conversion
          - convert
          - core
          - coroutine
          - coroutine2
          - crc
          - date_time
          - decimal
          - describe
          - detail
          - dll
          - dynamic_bitset
          - endian
          - exception
          - fiber
          - filesystem
          - flyweight
          - foreach
          - format
          - function
          - functional
          - function_types
          - fusion
          - geometry
          - gil
          - graph
          - graph_parallel
          - hana
          - hash2
          - headers
          - heap
          - histogram
          - hof
          - icl
          - integer
          - interprocess
          - intrusive
          - io
          - iostreams
          - iterator
          - json
          - lambda
          - lambda2
          - leaf
          - lexical_cast
          - locale
          - local_function
          - lockfree
          - log
          - logic
          - math
          - metaparse
          - move
          - mp11
          - mpi
          - mpl
          - mqtt5
          - msm
          - multiprecision
          - multi_array
          - multi_index
          - mysql

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get -y install libbz2-dev libopenmpi-dev libpython3-dev

      - name: Setup Boost
        run: |
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          git submodule update --init --jobs 3 tools/boostdep libs/assert libs/config libs/core libs/${{matrix.library}}
          python tools/boostdep/depinst/depinst.py -X test -g "--jobs 3" ${{matrix.library}}
          rm -rf tools/boost_install/*
          cp -r $GITHUB_WORKSPACE/* tools/boost_install
          ./bootstrap.sh
          ./b2 -d0 headers

      - name: Install Boost
        run: |
          cd ../boost-root
          echo "using python ;" >> ~/user-config.jam
          echo "using mpi ;" >> ~/user-config.jam
          ./b2 -j3 --prefix=$HOME/.local install

      - name: Configure ${{matrix.library}}
        working-directory: ../boost-root
        run: cmake -S tools/boost_install/test/component -B __build__ -DCMAKE_INSTALL_PREFIX=~/.local -DBoost_VERBOSE=ON -DCOMPONENT=${{matrix.library}}

      - name: Build test
        working-directory: ../boost-root
        run: cmake --build __build__

      - name: Run test
        working-directory: ../boost-root
        run: cmake --build __build__ --target check

  n-z:
    strategy:
      fail-fast: false
      matrix:
        library:
          - nowide
          - numeric/conversion
          - numeric/interval
          - numeric/odeint
          - numeric/ublas
          - openmethod
          - optional
          - outcome
          - parameter
          - parameter_python
          - parser
          - pfr
          - phoenix
          - polygon
          - poly_collection
          - pool
          - predef
          - preprocessor
          - process
          - program_options
          - property_map
          - property_map_parallel
          - property_tree
          - proto
          - ptr_container
          - python
          - qvm
          - random
          - range
          - ratio
          - rational
          - redis
          - regex
          - safe_numerics
          - scope
          - scope_exit
          - serialization
          - signals2
          - smart_ptr
          - sort
          - spirit
          # - stacktrace
          - statechart
          - static_assert
          - static_string
          - stl_interfaces
          - system
          # - test
          - thread
          - throw_exception
          - timer
          - tokenizer
          - tti
          - tuple
          - typeof
          - type_erasure
          - type_index
          - type_traits
          - units
          - unordered
          - url
          - utility
          - uuid
          - variant
          - variant2
          - vmd
          - wave
