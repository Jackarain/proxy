name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/**

env:
  UBSAN_OPTIONS: print_stacktrace=1

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: gcc-7
            cxxstd: "11,14,17"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: g++-7
          - toolset: gcc-8
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: g++-8
          - toolset: gcc-9
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
          - toolset: gcc-10
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: g++-10
          - toolset: gcc-11
            cxxstd: "11,14,17,2a"
            container: ubuntu:22.04
            os: ubuntu-latest
          - toolset: gcc-12
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:22.04
            os: ubuntu-latest
            install: g++-12
          - toolset: gcc-13
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: g++-13
          - toolset: gcc-14
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: g++-14
          - toolset: gcc-15
            cxxstd: "11,14,17,20,23,2c"
            container: ubuntu:26.04
            os: ubuntu-latest
            install: g++-15
          - toolset: gcc-16
            cxxstd: "11,14,17,20,23,2c"
            container: ubuntu:26.04
            os: ubuntu-latest
            install: g++-16
          - toolset: clang
            compiler: clang++-6.0
            cxxstd: "11,14,17"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-6.0
          - toolset: clang
            compiler: clang++-7
            cxxstd: "11,14,17"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-7
          - toolset: clang
            compiler: clang++-8
            cxxstd: "11,14,17"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-8
          - toolset: clang
            compiler: clang++-9
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-9
          - toolset: clang
            compiler: clang++-10
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-10
          - toolset: clang
            compiler: clang++-11
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-11
          - toolset: clang
            compiler: clang++-12
            cxxstd: "11,14,17,2a"
            container: ubuntu:20.04
            os: ubuntu-latest
            install: clang-12
          - toolset: clang
            compiler: clang++-13
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:22.04
            os: ubuntu-latest
            install: clang-13
          - toolset: clang
            compiler: clang++-14
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:22.04
            os: ubuntu-latest
            install: clang-14
          - toolset: clang
            compiler: clang++-15
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:22.04
            os: ubuntu-latest
            install: clang-15
          - toolset: clang
            compiler: clang++-16
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: clang-16
          - toolset: clang
            compiler: clang++-17
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: clang-17
          - toolset: clang
            compiler: clang++-18
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: clang-18
          - toolset: clang
            compiler: clang++-19
            cxxstd: "11,14,17,20,2b"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: clang-19
          - toolset: clang
            compiler: clang++-20
            cxxstd: "11,14,17,20,23,2c"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: clang-20
          - toolset: clang
            compiler: clang++-21
            cxxstd: "11,14,17,20,23,2c"
            container: ubuntu:26.04
            os: ubuntu-latest
            install: clang-21
          - toolset: clang
            compiler: clang++-22
            cxxstd: "11,14,17,20,23,2c"
            container: ubuntu:26.04
            os: ubuntu-latest
            install: clang-22
          - toolset: clang
            os: macos-14
            cxxstd: "11,14,17,20,2b"
          - toolset: clang
            os: macos-15
            cxxstd: "11,14,17,20,23,2c"
          - toolset: clang
            os: macos-26
            cxxstd: "11,14,17,20,23,2c"

    runs-on: ${{matrix.os}}
    container: ${{matrix.container}}

    defaults:
      run:
        shell: bash

    steps:
      - name: Setup container environment
        if: matrix.container
        run: |
          apt-get update
          apt-get -y install sudo python3 git g++ curl xz-utils

      - uses: actions/checkout@v6

      - name: Install packages
        if: matrix.install
        run: |
          sudo apt-get update
          sudo apt-get -y install ${{matrix.install}}

      - name: Setup Boost
        run: |
          echo GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          git submodule update --init libs/assert libs/bind
          cp -r $GITHUB_WORKSPACE/* tools/boostdep
          python3 tools/boostdep/depinst/depinst.py --git_args "--jobs 3" ../tools/boostdep
          ./bootstrap.sh
          ./b2 -d0 headers

      - name: Create user-config.jam
        if: matrix.compiler
        run: |
          echo "using ${{matrix.toolset}} : : ${{matrix.compiler}} ;" > ~/user-config.jam

      - name: Run tests
        run: |
          cd ../boost-root
          ./b2 -j3 tools/boostdep/test toolset=${{matrix.toolset}} cxxstd=${{matrix.cxxstd}} variant=debug,release

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: msvc-14.3
            cxxstd: "14,17,20,latest"
            addrmd: 32,64
            os: windows-2022
          - toolset: clang-win
            cxxstd: "14,17,20,latest"
            addrmd: 32,64
            os: windows-2022
          - toolset: gcc
            cxxstd: "11,14,17,2a"
            addrmd: 64
            os: windows-2022

    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Boost
        shell: cmd
        run: |
          echo GITHUB_REPOSITORY: %GITHUB_REPOSITORY%
          echo GITHUB_BASE_REF: %GITHUB_BASE_REF%
          echo GITHUB_REF: %GITHUB_REF%
          if "%GITHUB_BASE_REF%" == "" set GITHUB_BASE_REF=%GITHUB_REF%
          set BOOST_BRANCH=develop
          for /f %%i in ("%GITHUB_BASE_REF%") do if "%%~nxi" == "master" set BOOST_BRANCH=master
          echo BOOST_BRANCH: %BOOST_BRANCH%
          cd ..
          git clone -b %BOOST_BRANCH% --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          git submodule update --init libs/assert libs/bind
          xcopy /s /e /q %GITHUB_WORKSPACE% tools\boostdep\
          python tools/boostdep/depinst/depinst.py --git_args "--jobs 3" ../tools/boostdep
          cmd /c bootstrap
          b2 -d0 headers

      - name: Run tests
        shell: cmd
        run: |
          cd ../boost-root
          b2 -j3 tools/boostdep/test toolset=${{matrix.toolset}} cxxstd=${{matrix.cxxstd}} address-model=${{matrix.addrmd}} variant=debug,release embed-manifest-via=linker

  posix-python3:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Boost
        run: |
          echo GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          git submodule update --init tools/build
          cp -r $GITHUB_WORKSPACE/* tools/boostdep
          ./bootstrap.sh

      - name: Build Boostdep
        run: |
          cd ../boost-root
          python3 tools/boostdep/depinst/depinst.py --git_args "--jobs 3" ../tools/boostdep
          ./b2 -j3 tools/boostdep/build

  posix-cmake-build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get install libboost-filesystem-dev

      - name: Build Boostdep with CMake
        run: |
          cmake -S . -B __build__ -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=~/.local
          cmake --build __build__ --target install

  windows-cmake-build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Boost
        shell: cmd
        run: |
          echo GITHUB_REPOSITORY: %GITHUB_REPOSITORY%
          echo GITHUB_BASE_REF: %GITHUB_BASE_REF%
          echo GITHUB_REF: %GITHUB_REF%
          if "%GITHUB_BASE_REF%" == "" set GITHUB_BASE_REF=%GITHUB_REF%
          set BOOST_BRANCH=develop
          for /f %%i in ("%GITHUB_BASE_REF%") do if "%%~nxi" == "master" set BOOST_BRANCH=master
          echo BOOST_BRANCH: %BOOST_BRANCH%
          cd ..
          git clone -b %BOOST_BRANCH% --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          xcopy /s /e /q %GITHUB_WORKSPACE% tools\boostdep\
          python tools/boostdep/depinst/depinst.py --git_args "--jobs 3" ../tools/boostdep
          cmd /c bootstrap
          b2 install

      - name: Build Boostdep with CMake
        run: |
          cmake -S . -B __build__ -DBoost_ROOT=C:/Boost -DCMAKE_INSTALL_PREFIX=C:/usr/local
          cmake --build __build__ --target install --config Release

  posix-check-exceptions:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Boost
        run: |
          echo GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          git submodule update --init
          rm -rf tools/boostdep/*
          cp -r $GITHUB_WORKSPACE/* tools/boostdep
          ./bootstrap.sh
          ./b2 tools/boostdep/build

      - name: Check exceptions
        run: |
          cd ../boost-root
          dist/bin/boostdep --list-exceptions | diff -u tools/boostdep/depinst/exceptions.txt -

  posix-depinst:

    strategy:
      fail-fast: false
      matrix:
        library:
          - assert
          - algorithm
          - asio
          - beast
          - config
          - container_hash
          - core
          - endian
          - graph
          - geometry
          - mp11
          - serialization
          - static_assert
          - thread
          - throw_exception
          - uuid

        args: [ '', '-C' ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Boost
        run: |
          echo GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          cp -r $GITHUB_WORKSPACE/* tools/boostdep
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/${{matrix.library}}.git libs/${{matrix.library}}
          rm -rf libs/${{matrix.library}}/.git

      - name: Use depinst
        run: |
          cd ../boost-root
          python tools/boostdep/depinst/depinst.py --git_args "--jobs 3" ${{matrix.args}} ${{matrix.library}}
